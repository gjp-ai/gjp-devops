- name: Installing Nginx on Ubuntu
  hosts: all
  become: yes
      
  tasks:
    - name: Create gjp-open directory
      file:
        path: /var/www/gjp/open  # Change this path to your desired directory
        state: directory
        mode: '0755'

    - name: Upload build to /var/www/gjp/open
      copy:
        src: "../../../../gjp-open-web-react/dist/"
        dest: "/var/www/gjp/open"
        mode: 0755
      notify: Restart Nginx

  handlers:
    - name: Restart Nginx
      service:
        name: nginx
        state: restarted