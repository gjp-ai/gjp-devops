- name: Installing Nginx on Ubuntu
  hosts: all
  become: yes
      
  tasks:
    - name: Create gjp-admin directory
      file:
        path: /var/www/gjp/admin  # Change this path to your desired directory
        state: directory
        mode: '0755'

    - name: Upload build to /var/www/gjp/admin
      copy:
        src: "{{ playbook_dir }}/../../../../gjp-admin/gjp-admin-web-react/dist/"
        dest: "/var/www/gjp/admin"
        mode: 0755
      notify: Restart Nginx

  handlers:
    - name: Restart Nginx
      service:
        name: nginx
        state: restarted
