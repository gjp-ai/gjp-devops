---
- name: Backup Upload Folders  
  hosts: all
  vars:
    resources_dir_remote: /var/www/gjp/upload/
    local_backup_dir: "{{ lookup('env', 'HOME') }}/Library/CloudStorage/OneDrive-Personal/GJP-AI/Backup/gjp/upload/"
    rsync_remote_source: "{{ (ansible_user is defined) | ternary(ansible_user ~ '@', '') }}{{ ansible_host | default(inventory_hostname) }}:{{ resources_dir_remote }}"
    rsync_ssh_command: >-
      ssh
      -p {{ ansible_port | default(22) }}
      {% if ansible_ssh_private_key_file is defined %}-i {{ ansible_ssh_private_key_file }}{% endif %}
      {{ ansible_ssh_common_args | default('') }}

  tasks:
    - name: Ensure local backup directory exists
      ansible.builtin.file:
        path: "{{ local_backup_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false

    - name: Synchronize remote resources directory to local machine
      ansible.builtin.command:
        argv:
          - rsync
          - -a
          - --quiet
          - -e
          - "{{ rsync_ssh_command }}"
          - "{{ rsync_remote_source }}"
          - "{{ local_backup_dir }}"
      delegate_to: localhost
      become: false
